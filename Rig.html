<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIG Form Filler</title>
    <link rel="stylesheet" href="Rig.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="image.png" alt="Logo" class="logo">
        </div>

        <div class="content">
            <!-- Upload Section -->
            <div class="upload-section">
                <div class="button-group">
                    <button class="btn-load" type="button" onclick="chooseRigFolder()">📁 Choose RIG folder</button>
                    <div class="form-group" style="margin: 0;">
                        <label for="rigSelector">Select RIG:</label>
                        <select id="rigSelector" disabled onchange="fillForm()">
                            <option value="">-- Select a RIG --</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin: 0;">
                        <label for="componentSelector">Select component:</label>
                        <select id="componentSelector" disabled onchange="fillForm()">
                            <option value="">-- All components --</option>
                        </select>
                    </div>
                    <div class="form-group" id="centrifugeSelectorGroup" style="margin: 0; display: none;">
                        <label for="centrifugeSelector">Select centrifuge:</label>
                        <select id="centrifugeSelector" disabled onchange="fillForm()">
                            <option value="">-- Select No. --</option>
                        </select>
                    </div>
                </div>

                <input type="file" id="rigFolderFile" webkitdirectory directory multiple hidden onchange="loadFromFolder(this.files)" />

                <div id="statusMessage"></div>
            </div>

            <!-- Dataset Preview Section -->
            <div class="section dataset-section">
                <h2>📈 Selected RIG Data</h2>
                <div class="dataset-preview" id="datasetPreview">
                    <div class="empty-state">
                        <p>📤 Select a RIG to see its component data here</p>
                    </div>
                </div>
            </div>

            <div class="section catalogue-section">
                <h2>🧩 Matching Parts Catalogue <span id="orderCount">0 selected for order</span></h2>
                <div class="catalogue-preview" id="cataloguePreview">
                    <div class="empty-state">
                        <p>Select a component to see matching catalogue parts here</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script src="Rig.js"></script> 
</body>
</html>
